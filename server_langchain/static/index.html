<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TARS Live Console</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #000;
      color: #00ff99;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #111;
      padding: 10px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #00ff99;
    }
    #log {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      font-size: 16px;
      line-height: 1.4;
    }
    .log-entry { margin-bottom: 10px; }
    .server-event { color: #00bfff; }
    .tars-response { color: #00ff99; }
    .client-connect { color: #ffff00; }
    .tool-call { color: #ff6600; }
    footer {
      background-color: #111;
      padding: 10px;
      font-size: 14px;
      border-top: 2px solid #00ff99;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: red;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <header>TARS LIVE CONSOLE</header>

  <div id="log"></div>

  <footer>
    <div class="status" id="serverStatus">
      <div class="status-dot" id="serverDot"></div> SERVER
    </div>
    <div class="status" id="deviceStatus">
      <div class="status-dot" id="deviceDot"></div> DEVICE
    </div>
    <div class="status" id="micStatus">
      <div class="status-dot" id="micDot"></div> MIC
    </div>
  </footer>

  <script>
    const logContainer = document.getElementById('log');
    const serverDot = document.getElementById('serverDot');
    const deviceDot = document.getElementById('deviceDot');
    const micDot = document.getElementById('micDot');

    let deviceConnected = false;

    const ws = new WebSocket(`ws://${location.hostname}:8888/device`);

    function log(message, type = 'server-event') {
      const entry = document.createElement('div');
      entry.classList.add('log-entry', type);
      entry.textContent = message;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function blinkMic() {
      micDot.style.backgroundColor = '#00ff99'; // Blink green
      setTimeout(() => {
        micDot.style.backgroundColor = 'red';    // Back to red after 300ms
      }, 300);
    }

    ws.onopen = () => {
      serverDot.style.backgroundColor = '#00ff99';
      log('[System] WebSocket connection opened.', 'client-connect');
    };

    ws.onclose = () => {
      serverDot.style.backgroundColor = 'red';
      deviceDot.style.backgroundColor = 'red';
      micDot.style.backgroundColor = 'red';
      log('[System] WebSocket connection closed.', 'server-event');
    };

    ws.onerror = (error) => {
      log('[System] WebSocket error occurred.', 'server-event');
    };

    ws.onmessage = (event) => {
      if (typeof event.data === 'string') {
        try {
          const data = JSON.parse(event.data);

          if (data?.type === 'response.audio_transcript.delta' && data.delta) {
            log(`[TARS] ${data.delta}`, 'tars-response');

          } else if (data?.type === 'response.function_call_arguments.done') {
            log(`[Tool Call] ${data.name}`, 'tool-call');

          } else if (data?.type === 'text') {
            log(`[TARS-Text] ${data.text}`, 'tars-response');

          } else if (data?.type === 'mic.audio.chunk') {
            log('[ESP32] Microphone frame received', 'client-connect');
            blinkMic();
          }
            else {
            log(`[Server] ${JSON.stringify(data)}`, 'server-event');
          }

          // If receiving normal text or tool output, we assume device is alive
          if (!deviceConnected) {
            deviceConnected = true;
            deviceDot.style.backgroundColor = '#00ff99';
          }

        } catch (e) {
          log(`[Server] ${event.data}`, 'server-event');
        }

      } else {
        // Non-string = probably a Blob (audio buffer)
        log(`[Server] Streaming audio playback chunk`, 'server-event');
        
        if (!deviceConnected) {
          deviceConnected = true;
          deviceDot.style.backgroundColor = '#00ff99';
        }
      }
    };
  </script>
</body>
</html>
